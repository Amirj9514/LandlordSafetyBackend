[build]
  command = "npm run build"
  publish = "dist/managementfrontend/browser"

# Proxy API (production). `proxy.conf.json` only applies to `ng serve`; without this rule,
# `/*` → index.html would swallow `/api/*` and break PUT/PATCH/POST responses.
[[redirects]]
  from = "/api/*"
  to = "https://serviceportalbankend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200